apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qemu-exporter
  namespace: openstack
  labels:
    app: qemu-exporter
spec:
  selector:
    matchLabels:
      app: qemu-exporter
  template:
    metadata:
      labels:
        app: qemu-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9179"
    spec:
      hostPID: true
      # nodeSelector: add once the real compute-node label is confirmed on
      # Day 1 (this is a single-node cluster for now, so every node is a
      # compute node and no selector is required yet).
      containers:
        - name: qemu-exporter
          image: docker.io/lylekim/qemu-exporter:dev   # <- YOURUSER 를 Docker Hub 계정명으로 바꿀 것
          imagePullPolicy: Always
          ports:
            - containerPort: 9179
              name: metrics
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_PROC
              value: /host/proc
            - name: HOST_SYS_FS_CGROUP
              value: /host/sys/fs/cgroup
            - name: LIBVIRT_SOCK
              value: /var/run/libvirt/libvirt-sock-ro
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: libvirt-sock
              mountPath: /var/run/libvirt
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: libvirt-sock
          hostPath:
            path: /var/run/libvirt
