# Deliberate CPU contention for the Fig.3 experiment.
# Each replica burns one full core (busybox `while :; do :; done`).
# Start at replicas: 4 (node has 8 vCPU, fig-vm uses ~2, OSH ~2). Bump to 6/8 for
# a stronger effect -- but watch OSH pods; replicas 8 pushed node load to ~323 once.
apiVersion: apps/v1
kind: Deployment
metadata: {name: cpu-hog, namespace: default}
spec:
  replicas: 4
  selector: {matchLabels: {app: cpu-hog}}
  template:
    metadata: {labels: {app: cpu-hog}}
    spec:
      nodeSelector: {kubernetes.io/hostname: ip-10-0-1-129}
      terminationGracePeriodSeconds: 0
      containers:
        - name: hog
          image: busybox:1.36
          command: ["sh", "-c", "while :; do :; done"]
          resources:
            requests: {cpu: "100m", memory: "16Mi"}
